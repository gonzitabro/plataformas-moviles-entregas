<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincias de Argentina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="encabezado text-center">
        <div class="container">
            <p class="sobre-titulo">CONOCÉ NUESTRO PAÍS</p>
            <h1>Provincias de Argentina</h1>
            <p class="descripcion">Descubrí las provincias argentinas, sus capitales y datos principales.</p>
            <span id="cantidad" class="badge rounded-pill">Cargando provincias...</span>
        </div>
    </header>

    <main class="container py-5">
        <input id="buscador" class="form-control mb-4" type="text" placeholder="Buscar provincia por nombre...">

        <div id="provincias" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Cargando información...</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <p class="mb-0">Proyecto de Plataformas Móviles · Datos obtenidos de una API externa</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
